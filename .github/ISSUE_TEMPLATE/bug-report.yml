name: Bug report
description: Something in the web app or extension is broken
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste API keys, tokens, or real personal data.**
        For security vulnerabilities, use private reporting instead — see SECURITY.md.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web app — onboarding
        - Web app — profile
        - Web app — job tracker
        - Web app — answer library
        - Extension — popup / sign-in
        - Extension — side panel
        - Extension — page overlay / autofill
        - API / AI answers
        - Resume parsing
        - Speech to text
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to...
        2. Click...
        3. See...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Console output
      description: DevTools console, or the extension service worker log. Redact anything personal.
      render: shell

  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: Chrome 149, macOS 15, self-hosted / ap.example.com
