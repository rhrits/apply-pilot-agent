    <text x="540" y="170" font-size="20" font-weight="700" letter-spacing="4" fill="#f0abfc">THE CAREER COPILOT</text>
    <text x="540" y="252" font-size="68" font-weight="900" letter-spacing="-3">AUTO JOB APPLY</text>
    <text x="540" y="322" font-size="68" font-weight="900" letter-spacing="-3" fill="#f0abfc">AI AGENT</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="290" y="390" width="500" height="500" rx="104" fill="url(#logo)"/>
    <path d="M354 554 410 454l112 78c16-4 32-6 48-6s32 2 48 6l112-78 8 136c0 122-83 205-168 248-85-43-168-126-168-248Z" fill="#fffdfb"/>
    <path d="m354 554 112 48-56 34Z" fill="#ead7d2"/><path d="m726 554-112 48 56 34Z" fill="#e7d9e6"/>
    <path d="M434 636 514 604l32 36-56 54-56-15Z" fill="#2b1022"/><path d="M658 636 578 604l-32 36 56 54 56-15Z" fill="#2b1022"/>
    <rect x="487" y="640" width="18" height="18" rx="4" fill="#fffdfb"/><rect x="587" y="640" width="18" height="18" rx="4" fill="#fffdfb"/>
    <path d="m506 757 40 30 40-30" fill="none" stroke="#2b1022" stroke-linecap="round" stroke-linejoin="round" stroke-width="12"/>
