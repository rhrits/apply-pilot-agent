  <g class="sans" text-anchor="middle"><text x="540" y="957" font-size="31" font-weight="800" fill="#fff">Build profile · Autofill forms · Track jobs</text><text x="540" y="1000" font-size="22" fill="#d8cfe7">One verified story for every application.</text></g>
  <g class="sans">
