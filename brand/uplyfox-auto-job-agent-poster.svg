<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Auto Job Apply AI Agent</title>
  <desc id="desc">UplyFox branded poster featuring the AI job application agent, profile builder, browser autofill, and job tracker.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#130d28"/><stop offset=".5" stop-color="#4a1237"/><stop offset="1" stop-color="#17194b"/></linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b91c1c"/><stop offset=".48" stop-color="#7f1d35"/><stop offset="1" stop-color="#4338a5"/></linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f0abfc"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#d946ef" stop-opacity=".35"/><stop offset="1" stop-color="#d946ef" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="25" stdDeviation="28" flood-color="#06030f" flood-opacity=".5"/></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
    <style>.sans{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}</style>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/><rect width="1080" height="1350" fill="url(#grid)"/>
  <ellipse cx="540" cy="630" rx="500" ry="520" fill="url(#glow)"/>
  <g class="sans" fill="#fff" text-anchor="middle">
