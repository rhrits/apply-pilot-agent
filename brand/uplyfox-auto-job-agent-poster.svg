    <circle cx="220" cy="1106" r="21" fill="#291438"/><path d="m210 1106 7 7 14-16" fill="none" stroke="#f5d0fe" stroke-linecap="round" stroke-linejoin="round" stroke-width="5"/>
    <text x="266" y="1115" font-size="25" font-weight="900" fill="#291438">AUTO-FILL THE BUSYWORK</text><text x="850" y="1115" text-anchor="end" font-size="18" font-weight="700" fill="#4c1d65">YOU SUBMIT</text>
  </g>
  <text x="540" y="1240" text-anchor="middle" class="sans" font-size="20" font-weight="700" letter-spacing="3" fill="#d8cfe7">YOUR FACTS. YOUR REVIEW. YOUR NEXT MOVE.</text>
