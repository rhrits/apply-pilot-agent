<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Build your profile. Apply with confidence.</title>
  <desc id="desc">Minimal UplyFox poster about building a verified profile for job applications.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffaf7"/><stop offset="1" stop-color="#f2eafa"/></linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#991b1b"/><stop offset=".48" stop-color="#7f1d35"/><stop offset="1" stop-color="#312e81"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8b1e3f"/><stop offset="1" stop-color="#5546d9"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#3b1634" flood-opacity=".2"/></filter>
    <style>.sans{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}</style>
  </defs>
  <rect width="1080" height="1350" fill="url(#paper)"/>
  <circle cx="935" cy="120" r="230" fill="#e9d5ff" opacity=".6"/><circle cx="80" cy="1260" r="270" fill="#fce7f3" opacity=".8"/>
  <g class="sans">
    <text x="92" y="108" font-size="24" font-weight="900" letter-spacing="6" fill="#7f1d35">UPLYFOX</text>
    <text x="92" y="198" font-size="66" font-weight="900" letter-spacing="-3" fill="#24152f">BUILD YOUR</text>
    <text x="92" y="268" font-size="66" font-weight="900" letter-spacing="-3" fill="#5546d9">PROFILE.</text>
    <text x="92" y="320" font-size="24" fill="#6c5c72">Apply with confidence, not copy-paste fatigue.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="365" y="390" width="350" height="350" rx="78" fill="url(#logo)"/>
    <path d="M410 514 449 444l78 54c11-3 22-4 33-4s22 1 33 4l78-54 6 95c0 85-58 144-117 174-59-30-117-89-117-174Z" fill="#fffdfb"/>
    <path d="m410 514 78 34-39 24Z" fill="#ead7d2"/><path d="m670 514-78 34 39 24Z" fill="#e7d9e6"/>
    <path d="M466 572 522 550l22 25-39 38-39-11Z" fill="#2b1022"/><path d="M614 572 558 550l-22 25 39 38 39-11Z" fill="#2b1022"/>
    <rect x="503" y="575" width="13" height="13" rx="3" fill="#fffdfb"/><rect x="573" y="575" width="13" height="13" rx="3" fill="#fffdfb"/>
    <path d="m517 657 28 21 28-21" fill="none" stroke="#2b1022" stroke-linecap="round" stroke-width="9"/>
  </g>
  <g class="sans">
    <g transform="translate(92 805)"><circle cx="28" cy="28" r="28" fill="#f0abfc"/><text x="28" y="36" text-anchor="middle" font-size="20" font-weight="900" fill="#3b1634">01</text><text x="78" y="24" font-size="25" font-weight="800" fill="#24152f">Add your real story</text><text x="78" y="53" font-size="17" fill="#6c5c72">Resume, projects, skills, and experience.</text></g>
    <g transform="translate(92 895)"><circle cx="28" cy="28" r="28" fill="#c4b5fd"/><text x="28" y="36" text-anchor="middle" font-size="20" font-weight="900" fill="#312e81">02</text><text x="78" y="24" font-size="25" font-weight="800" fill="#24152f">Get grounded answers</text><text x="78" y="53" font-size="17" fill="#6c5c72">Suggestions based on facts you approve.</text></g>
    <g transform="translate(92 985)"><circle cx="28" cy="28" r="28" fill="#fdba74"/><text x="28" y="36" text-anchor="middle" font-size="20" font-weight="900" fill="#7c2d12">03</text><text x="78" y="24" font-size="25" font-weight="800" fill="#24152f">Move application by application</text><text x="78" y="53" font-size="17" fill="#6c5c72">Autofill the repetitive parts. Review the rest.</text></g>
  </g>
  <rect x="92" y="1135" width="896" height="2" fill="url(#accent)" opacity=".35"/>
  <g class="sans" fill="#24152f"><text x="92" y="1202" font-size="22" font-weight="800">PROFILE</text><text x="302" y="1202" font-size="22" font-weight="800">ANSWERS</text><text x="530" y="1202" font-size="22" font-weight="800">AUTOFILL</text><text x="758" y="1202" font-size="22" font-weight="800">TRACKER</text><text x="540" y="1262" text-anchor="middle" font-size="19" fill="#6c5c72">Build once. Start every application further ahead.</text></g>
</svg>