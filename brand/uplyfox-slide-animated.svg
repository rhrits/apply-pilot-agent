<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">UplyFox Slide Animation</title>
  <desc id="desc">Transparent Pixel fox that slides into view with a soft glance and settle motion.</desc>
  <defs>
    <linearGradient id="wine-slide" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#991b1b"/><stop offset=".6" stop-color="#7f1d35"/><stop offset="1" stop-color="#312e81"/></linearGradient>
    <filter id="slide-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#4c0519" flood-opacity=".24"/></filter>
    <style>
      .slide{animation:slide-in 3.8s cubic-bezier(.16,1,.3,1) infinite;transform-box:fill-box;transform-origin:center}.eyes{animation:slide-look 3.8s ease-in-out infinite}.spark{animation:trail 3.8s ease-in-out infinite}
      @keyframes slide-in{0%{transform:translateX(-280px) scale(.75);opacity:0}18%{opacity:1}44%{transform:translateX(20px) scale(1.05)}60%{transform:translateX(-8px) scale(.99)}78%,100%{transform:translateX(0) scale(1);opacity:1}}
      @keyframes slide-look{0%,38%{transform:translateX(-10px)}52%,68%{transform:translateX(7px)}80%,100%{transform:translateX(0)}}
      @keyframes trail{0%,18%{opacity:0;transform:translateX(-12px)}32%,58%{opacity:.7;transform:translateX(0)}78%,100%{opacity:0;transform:translateX(12px)}}
    </style>
  </defs>
  <g class="spark" fill="none" stroke="url(#wine-slide)" stroke-linecap="round"><path d="M62 180h65M42 256h78M68 332h58" stroke-width="7"/><path d="M32 201h22M22 310h28" stroke-width="4"/></g>
  <g class="slide" filter="url(#slide-shadow)">
    <path d="M64 164 120 64l112 78c16-4 32-6 48-6s32 2 48 6L440 64l8 136c0 122-83 205-168 248C195 405 112 322 112 200Z" fill="#fffdfb"/>
    <path d="m64 164 112 48-56 34Z" fill="#ead7d2"/><path d="m448 164-112 48 56 34Z" fill="#e7d9e6"/>
    <path d="M144 246 224 214l32 36-56 54-56-15Z" fill="#2b1022"/><path d="M368 246 288 214l-32 36 56 54 56-15Z" fill="#2b1022"/>
    <rect x="197" y="250" width="18" height="18" rx="4" fill="#fffdfb"/><rect x="297" y="250" width="18" height="18" rx="4" fill="#fffdfb"/>
    <g class="eyes" fill="#2b1022"><rect x="203" y="254" width="7" height="10" rx="2"/><rect x="303" y="254" width="7" height="10" rx="2"/></g>
    <path d="m216 367 40 30 40-30" fill="none" stroke="#2b1022" stroke-linecap="round" stroke-linejoin="round" stroke-width="12"/>
  </g>
</svg>
