<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">What is UplyFox?</title>
  <desc id="desc">A social poster introducing UplyFox, the grounded job-application copilot and browser extension.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#160f2b" />
      <stop offset="0.52" stop-color="#3b1230" />
      <stop offset="1" stop-color="#17143d" />
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="42%" r="52%">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.34" />
      <stop offset="0.55" stop-color="#7f1d35" stop-opacity="0.12" />
      <stop offset="1" stop-color="#160f2b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#991b1b" />
      <stop offset="0.48" stop-color="#7f1d35" />
      <stop offset="1" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0abfc" />
      <stop offset="1" stop-color="#c4b5fd" />
    </linearGradient>
    <filter id="logo-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#080513" flood-opacity="0.48" />
    </filter>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#fff" stroke-opacity="0.045" />
    </pattern>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1080" height="1350" fill="url(#background)" />
  <rect width="1080" height="1350" fill="url(#grid)" />
  <ellipse cx="540" cy="585" rx="480" ry="480" fill="url(#halo)" />
  <circle cx="540" cy="590" r="300" fill="#a855f7" opacity="0.16" filter="url(#soft-glow)" />

  <g class="sans" fill="#fff">
    <text x="540" y="112" text-anchor="middle" font-size="22" font-weight="700" letter-spacing="5" fill="#e9d5ff">UPLYFOX</text>
    <text x="540" y="178" text-anchor="middle" font-size="56" font-weight="800" letter-spacing="-2">What is UplyFox?</text>
    <text x="540" y="224" text-anchor="middle" font-size="25" fill="#d8cfe7">Your grounded job-application copilot.</text>
  </g>

  <!-- Central UplyFox logo -->
  <g filter="url(#logo-shadow)">
    <rect x="290" y="320" width="500" height="500" rx="104" fill="url(#logo)" />
    <rect x="290" y="320" width="500" height="500" rx="104" fill="url(#halo)" opacity="0.34" />
    <path d="M354 484 410 384l112 78c16-4 32-6 48-6s32 2 48 6l112-78 8 136c0 122-83 205-168 248-85-43-168-126-168-248Z" fill="#fffdfb" />
    <path d="m354 484 112 48-56 34Z" fill="#ead7d2" />
    <path d="m726 484-112 48 56 34Z" fill="#e7d9e6" />
    <path d="M434 566 514 534l32 36-56 54-56-15Z" fill="#2b1022" />
    <path d="M658 566 578 534l-32 36 56 54 56-15Z" fill="#2b1022" />
    <rect x="487" y="570" width="18" height="18" rx="4" fill="#fffdfb" />
    <rect x="587" y="570" width="18" height="18" rx="4" fill="#fffdfb" />
    <path d="m506 687 40 30 40-30" fill="none" stroke="#2b1022" stroke-linecap="round" stroke-linejoin="round" stroke-width="12" />
  </g>

  <g class="sans" text-anchor="middle">
    <text x="540" y="892" font-size="42" font-weight="800" fill="#fff">Apply with your real story.</text>
    <text x="540" y="934" font-size="23" fill="#d8cfe7">Build once. Review every answer. Move faster.</text>
  </g>

  <!-- Product promises -->
  <g class="sans">
    <g transform="translate(112 1010)">
      <rect width="246" height="92" rx="20" fill="#fff" fill-opacity="0.09" stroke="#fff" stroke-opacity="0.14" />
      <circle cx="34" cy="46" r="17" fill="#c4b5fd" />
      <path d="m26 46 6 6 11-13" fill="none" stroke="#291438" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" />
      <text x="66" y="42" font-size="18" font-weight="700" fill="#fff">Verified profile</text>
      <text x="66" y="66" font-size="14" fill="#d8cfe7">Your facts first</text>
    </g>
    <g transform="translate(417 1010)">
      <rect width="246" height="92" rx="20" fill="#fff" fill-opacity="0.09" stroke="#fff" stroke-opacity="0.14" />
      <circle cx="34" cy="46" r="17" fill="#f0abfc" />
      <path d="M34 35v22M23 46h22" stroke="#291438" stroke-linecap="round" stroke-width="4" />
      <text x="66" y="42" font-size="18" font-weight="700" fill="#fff">Grounded answers</text>
      <text x="66" y="66" font-size="14" fill="#d8cfe7">No invented experience</text>
    </g>
    <g transform="translate(722 1010)">
      <rect width="246" height="92" rx="20" fill="#fff" fill-opacity="0.09" stroke="#fff" stroke-opacity="0.14" />
      <circle cx="34" cy="46" r="17" fill="#fdba74" />
      <path d="M26 46h16M34 38v16" stroke="#291438" stroke-linecap="round" stroke-width="4" />
      <text x="66" y="42" font-size="18" font-weight="700" fill="#fff">You stay in control</text>
      <text x="66" y="66" font-size="14" fill="#d8cfe7">Never auto-submits</text>
    </g>
  </g>

  <!-- Extension callout -->
  <g class="sans" transform="translate(180 1192)">
    <rect width="720" height="86" rx="43" fill="url(#accent)" />
    <rect x="22" y="20" width="46" height="46" rx="13" fill="#291438" />
    <path d="M38 35h14v14H38zM48 49h9v9h-9z" fill="#f5d0fe" />
    <text x="92" y="53" font-size="23" font-weight="800" fill="#291438">BROWSER EXTENSION</text>
    <text x="635" y="53" text-anchor="end" font-size="18" font-weight="700" fill="#4c1d65">AI JOB APPLY AGENT</text>
  </g>
</svg>