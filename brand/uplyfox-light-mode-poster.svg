<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">UplyFox Auto Job Apply AI Agent</title>
  <desc id="desc">Light mode UplyFox poster with the fox logo centered inside its branded background box.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fffdfb" />
      <stop offset="1" stop-color="#f4f1ff" />
    </linearGradient>
    <linearGradient id="logo-box" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#991b1b" />
      <stop offset="0.48" stop-color="#7f1d35" />
      <stop offset="1" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#5546d9" />
      <stop offset="1" stop-color="#8b1e3f" />
    </linearGradient>
    <filter id="box-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#392453" flood-opacity="0.2" />
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1080" height="1350" fill="url(#paper)" />
  <circle cx="972" cy="112" r="230" fill="#ede9fe" />
  <circle cx="74" cy="1278" r="250" fill="#fce7f3" />
  <path d="M0 360H1080" stroke="#ece7f2" stroke-width="2" />

  <g class="sans">
    <text x="92" y="112" font-size="24" font-weight="900" letter-spacing="6" fill="#7f1d35">UPLYFOX</text>
    <text x="92" y="188" font-size="62" font-weight="900" letter-spacing="-3" fill="#24152f">AUTO JOB APPLY</text>
    <text x="92" y="254" font-size="62" font-weight="900" letter-spacing="-3" fill="#5546d9">AI AGENT</text>
    <text x="92" y="304" font-size="23" fill="#6c5c72">Build your profile. Autofill the busywork. Track every step.</text>
  </g>

  <!-- The fox stays inside a clear branded background box. -->
  <g filter="url(#box-shadow)">
    <rect x="250" y="430" width="580" height="580" rx="116" fill="url(#logo-box)" />
    <rect x="274" y="454" width="532" height="532" rx="94" fill="none" stroke="#fff" stroke-opacity="0.14" stroke-width="2" />
    <path d="M324 614 388 500l130 91c18-5 37-7 57-7s39 2 57 7l130-91 9 155c0 141-96 237-194 286-98-49-194-145-194-286Z" fill="#fffdfb" />
    <path d="m324 614 130 56-65 39Z" fill="#ead7d2" />
    <path d="m756 614-130 56 65 39Z" fill="#e7d9e6" />
    <path d="M417 708 510 671l37 42-65 63-65-17Z" fill="#2b1022" />
    <path d="M663 708 570 671l-37 42 65 63 65-17Z" fill="#2b1022" />
    <rect x="480" y="712" width="21" height="21" rx="4" fill="#fffdfb" />
    <rect x="579" y="712" width="21" height="21" rx="4" fill="#fffdfb" />
    <path d="m510 850 45 34 45-34" fill="none" stroke="#2b1022" stroke-linecap="round" stroke-linejoin="round" stroke-width="14" />
  </g>

  <g class="sans" text-anchor="middle">
    <text x="540" y="1078" font-size="35" font-weight="900" fill="#24152f">One profile. Every application.</text>
    <text x="540" y="1120" font-size="21" fill="#6c5c72">Your facts first. Your review always.</text>
  </g>

  <g class="sans">
    <rect x="92" y="1176" width="896" height="78" rx="39" fill="#fff" stroke="#e4dff1" stroke-width="2" />
    <circle cx="133" cy="1215" r="16" fill="#c4b5fd" />
    <path d="m125 1215 6 6 11-13" fill="none" stroke="#312e81" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" />
    <text x="170" y="1223" font-size="19" font-weight="800" fill="#24152f">BUILD PROFILE</text>
    <circle cx="390" cy="1215" r="5" fill="#d7cfea" />
    <text x="425" y="1223" font-size="19" font-weight="800" fill="#24152f">AUTOFILL</text>
    <circle cx="625" cy="1215" r="5" fill="#d7cfea" />
    <text x="660" y="1223" font-size="19" font-weight="800" fill="#24152f">TRACKER</text>
    <circle cx="838" cy="1215" r="5" fill="#d7cfea" />
    <text x="950" y="1223" text-anchor="end" font-size="19" font-weight="800" fill="#5546d9">REVIEW FIRST</text>
  </g>
</svg>