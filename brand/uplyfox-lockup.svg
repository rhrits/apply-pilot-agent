<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" role="img" aria-labelledby="title desc">
  <title id="title">UplyFox Brand Lockup</title>
  <desc id="desc">The UplyFox pixel mark with modern typography in deep purple and orange.</desc>
  <defs>
    <linearGradient id="lockup-orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff944d"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#d9480f"/>
    </linearGradient>
  </defs>

  <!-- Fox Icon (64x64) -->
  <g transform="translate(8, 8)">
    <rect width="64" height="64" rx="16" fill="url(#lockup-orange)"/>
    <!-- Angular White Mask scaled to 64px -->
    <path d="M9 22 L16 8 L30 18 C31 18 32 17 32 17 C33 17 34 18 34 18 L48 8 L55 22 C55 37 45 48 34 53 C33 54 31 54 30 53 C19 48 9 37 9 22 Z" fill="#ffffff"/>
    <polygon points="9,22 23,28 16,32" fill="#fed7aa"/>
    <polygon points="55,22 41,28 48,32" fill="#fed7aa"/>
    <polygon points="18,31 28,27 32,32 25,38 18,36" fill="#241b18"/>
    <polygon points="46,31 36,27 32,32 39,38 46,36" fill="#241b18"/>
    <rect x="24" y="31" width="3" height="3" fill="#ffffff"/>
    <rect x="37" y="31" width="3" height="3" fill="#ffffff"/>
    <path d="M27 45 L32 49 L37 45" fill="none" stroke="#241b18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark "UplyFox" -->
  <text x="86" y="52" font-family="'Space Grotesk', system-ui, sans-serif" font-size="34" font-weight="700" letter-spacing="-1.2">
    <tspan fill="#1f2040">Uply</tspan><tspan fill="url(#lockup-orange)">Fox</tspan>
  </text>
</svg>
