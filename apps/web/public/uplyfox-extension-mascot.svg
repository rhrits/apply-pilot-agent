<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">UplyFox Extension Mascot</title>
  <desc id="desc">A small friendly UplyFox character carrying a purple application satchel and ready to help fill a form.</desc>
  <defs>
    <linearGradient id="mascot-wine" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#991b1b"/><stop offset=".55" stop-color="#7f1d35"/><stop offset="1" stop-color="#312e81"/></linearGradient>
    <linearGradient id="satchel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ede9fe"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
    <filter id="mascot-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#312e81" flood-opacity=".2"/></filter>
    <style>
      .mascot{transform-box:fill-box;transform-origin:center;animation:mascot-bounce 3.2s ease-in-out infinite}.helper-spark{transform-box:fill-box;transform-origin:center;animation:spark-pulse 1.8s ease-in-out infinite}.mascot-eye{transform-box:fill-box;transform-origin:center;animation:mascot-blink 3.2s ease-in-out infinite}
      @keyframes mascot-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      @keyframes mascot-blink{0%,41%,47%,100%{transform:scaleY(1)}43%,45%{transform:scaleY(.08)}}
      @keyframes spark-pulse{0%,100%{opacity:.45;transform:scale(.85) rotate(-8deg)}50%{opacity:1;transform:scale(1.1) rotate(8deg)}}
    </style>
  </defs>
  <g class="mascot" filter="url(#mascot-shadow)">
    <!-- Tail -->
    <path d="M178 178c48 2 62 34 50 57-11 20-42 19-61 1 24 7 38-2 39-15 1-16-17-27-39-27Z" fill="url(#mascot-wine)"/>
    <path d="M209 207c14 3 20 11 18 19-3 9-13 13-25 10 12-6 14-13 7-20Z" fill="#fffdfb"/>
    <!-- Body -->
    <path d="M77 150c0-27 22-43 51-43s51 16 51 43v51c0 19-14 31-51 31s-51-12-51-31Z" fill="url(#mascot-wine)"/>
    <!-- Feet -->
    <ellipse cx="106" cy="224" rx="22" ry="10" fill="#4c0519"/><ellipse cx="150" cy="224" rx="22" ry="10" fill="#4c0519"/>
    <!-- Head / same Pixel mask character -->
    <path d="M45 84 66 30l48 35c7-2 14-3 22-3s15 1 22 3l48-35 21 54c0 56-38 92-91 111C83 176 45 140 45 84Z" fill="#fffdfb"/>
    <path d="m45 84 48 21-24 15Z" fill="#ead7d2"/><path d="m211 84-48 21 24 15Z" fill="#e7d9e6"/>
    <path d="M80 120 115 106l13 16-24 24-24-7Z" fill="#2b1022"/><path d="M176 120 141 106l-13 16 24 24 24-7Z" fill="#2b1022"/>
    <rect class="mascot-eye" x="103" y="119" width="8" height="8" rx="2" fill="#fffdfb"/><rect class="mascot-eye" x="145" y="119" width="8" height="8" rx="2" fill="#fffdfb"/>
    <path d="m110 171 26 18 26-18" fill="none" stroke="#2b1022" stroke-linecap="round" stroke-linejoin="round" stroke-width="7"/>
    <!-- Light purple helper satchel -->
    <path d="M49 151c0-9 7-16 16-16h31c9 0 16 7 16 16v34H49Z" fill="url(#satchel)" stroke="#5546d9" stroke-width="4"/>
    <path d="M64 135c0-15 8-24 17-24s17 9 17 24" fill="none" stroke="#5546d9" stroke-linecap="round" stroke-width="6"/>
    <path d="M69 167h23" stroke="#5546d9" stroke-linecap="round" stroke-width="4"/>
    <path d="M76 160v14M85 160v14" stroke="#5546d9" stroke-linecap="round" stroke-width="3"/>
  </g>
  <!-- UplyFox helper spark -->
  <path class="helper-spark" d="M220 31c3 12 7 16 19 19-12 3-16 7-19 19-3-12-7-16-19-19 12-3 16-7 19-19Z" fill="#5546d9"/>
</svg>
