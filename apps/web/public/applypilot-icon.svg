<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">ApplyPilot</title>
  <desc id="desc">A violet squircle with a compass sparkle and an insertion cursor, representing precise, verified autofill.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b8dff"/>
      <stop offset=".55" stop-color="#6f5eea"/>
      <stop offset="1" stop-color="#4a3bd1"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#2c1f8a" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- squircle base -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)"/>
  <!-- top glass highlight -->
  <path d="M10 34C10 18 22 8 40 8h48c18 0 30 10 30 26v6H10z" fill="url(#glow)"/>
  <!-- compass bezel -->
  <circle cx="64" cy="64" r="40" fill="none" stroke="#ffffff" stroke-opacity=".22" stroke-width="2.5"/>

  <!-- sparkle / compass needle -->
  <g filter="url(#soft)">
    <path d="M64 30c2.5 13 5.6 20.4 12 26.7C82.2 62.9 90 66 103 68c-13 2-20.8 5.1-27 11.3C69.6 85.6 66.5 93 64 106c-2.5-13-5.6-20.4-12-26.7C45.8 73.1 38 70 25 68c13-2 20.8-5.1 27-11.3C58.4 50.4 61.5 43 64 30z" fill="#ffffff"/>
  </g>
</svg>

