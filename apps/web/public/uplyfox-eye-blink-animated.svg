<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Animated UplyFox Eye Blink Mark</title>
  <desc id="desc">Transparent UplyFox face with a calm eye-blink animation.</desc>
  <defs>
    <filter id="face-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#2b1022" flood-opacity=".22"/>
    </filter>
    <style>
      .eye-blink{transform-box:fill-box;transform-origin:center;animation:blink 4.8s ease-in-out infinite}
      @keyframes blink{0%,39%,45%,78%,84%,100%{transform:scaleY(1)}41%,43%,80%,82%{transform:scaleY(.08)}}
    </style>
  </defs>
  <g filter="url(#face-shadow)">
    <path d="M64 164 120 64l112 78c16-4 32-6 48-6s32 2 48 6L440 64l8 136c0 122-83 205-168 248C195 405 112 322 112 200Z" fill="#fffdfb"/>
    <path d="m64 164 112 48-56 34Z" fill="#ead7d2"/>
    <path d="m448 164-112 48 56 34Z" fill="#e7d9e6"/>
    <path d="M144 246 224 214l32 36-56 54-56-15Z" fill="#2b1022"/>
    <path d="M368 246 288 214l-32 36 56 54 56-15Z" fill="#2b1022"/>
    <g class="eye-blink">
      <rect x="197" y="250" width="18" height="18" rx="4" fill="#fffdfb"/>
      <rect x="297" y="250" width="18" height="18" rx="4" fill="#fffdfb"/>
    </g>
    <g fill="#2b1022">
      <rect x="203" y="254" width="7" height="10" rx="2"/>
      <rect x="302" y="254" width="7" height="10" rx="2"/>
    </g>
    <path d="m216 367 40 30 40-30" fill="none" stroke="#2b1022" stroke-linecap="round" stroke-linejoin="round" stroke-width="12"/>
  </g>
</svg>
