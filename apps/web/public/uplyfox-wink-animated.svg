<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">UplyFox Wink Animation</title>
  <desc id="desc">Transparent Pixel fox that blinks, winks, and glances toward the active application field.</desc>
  <defs>
    <linearGradient id="wine" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#991b1b"/><stop offset=".55" stop-color="#7f1d35"/><stop offset="1" stop-color="#312e81"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#4c0519" flood-opacity=".25"/></filter>
    <style>
      .fox{transform-box:fill-box;transform-origin:center;animation:idle 4.8s ease-in-out infinite}.left-eye{animation:wink 4.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.right-eye{animation:blink 4.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.pupils{animation:look 4.8s ease-in-out infinite}.spark{transform-box:fill-box;transform-origin:center;animation:spark 2.2s ease-in-out infinite}
      @keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      @keyframes blink{0%,22%,30%,66%,72%,100%{transform:scaleY(1)}24%,28%,68%,70%{transform:scaleY(.08)}}
      @keyframes wink{0%,42%,50%,100%{transform:scaleY(1)}44%,48%{transform:scaleY(.08)}}
      @keyframes look{0%,22%{transform:translateX(0)}34%,55%{transform:translateX(-7px)}70%,100%{transform:translateX(0)}}
      @keyframes spark{0%,100%{opacity:.35;transform:scale(.8) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(18deg)}}
    </style>
  </defs>
  <g class="fox" filter="url(#shadow)">
    <path d="M64 164 120 64l112 78c16-4 32-6 48-6s32 2 48 6L440 64l8 136c0 122-83 205-168 248C195 405 112 322 112 200Z" fill="#fffdfb"/>
    <path d="m64 164 112 48-56 34Z" fill="#ead7d2"/><path d="m448 164-112 48 56 34Z" fill="#e7d9e6"/>
    <path d="M144 246 224 214l32 36-56 54-56-15Z" fill="#2b1022"/><path d="M368 246 288 214l-32 36 56 54 56-15Z" fill="#2b1022"/>
    <g class="left-eye"><rect x="197" y="250" width="18" height="18" rx="4" fill="#fffdfb"/></g>
    <g class="right-eye"><rect x="297" y="250" width="18" height="18" rx="4" fill="#fffdfb"/></g>
    <g class="pupils" fill="#2b1022"><rect x="203" y="254" width="7" height="10" rx="2"/><rect x="303" y="254" width="7" height="10" rx="2"/></g>
    <path d="m216 367 40 30 40-30" fill="none" stroke="#2b1022" stroke-linecap="round" stroke-linejoin="round" stroke-width="12"/>
  </g>
  <g class="spark" fill="url(#wine)"><path d="M426 118c5 18 11 24 29 29-18 5-24 11-29 29-5-18-11-24-29-29 18-5 24-11 29-29Z"/><circle cx="94" cy="326" r="5"/></g>
</svg>
