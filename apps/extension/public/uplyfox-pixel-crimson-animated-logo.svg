<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Animated UplyFox Pixel Crimson Logo</title>
  <desc id="desc">Animated UplyFox fox face with blinking eyes and a gentle breathing motion.</desc>
  <defs>
    <linearGradient id="blood-purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#991b1b"/><stop offset="48%" stop-color="#7f1d35"/><stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="rim-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".24"/><stop offset="36%" stop-color="#ffffff" stop-opacity=".04"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="depth" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#2b1022" flood-opacity=".28"/></filter>
    <style>
      .fox-motion{transform-box:fill-box;transform-origin:center;animation:fox-breathe 5s ease-in-out infinite}
      .eye-blink{transform-box:fill-box;transform-origin:center;animation:blink 5s ease-in-out infinite}
      .eye-glance{animation:glance 5s ease-in-out infinite}
      @keyframes fox-breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
      @keyframes blink{0%,39%,45%,78%,84%,100%{transform:scaleY(1)}41%,43%,80%,82%{transform:scaleY(.08)}}
      @keyframes glance{0%,18%{transform:translateX(0)}28%,43%{transform:translateX(8px)}52%,68%{transform:translateX(-8px)}77%,100%{transform:translateX(0)}}
    </style>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#blood-purple)"/><rect width="512" height="512" rx="104" fill="url(#rim-light)"/>
  <g class="fox-motion" filter="url(#depth)">
    <path d="M64 164 120 64l112 78c16-4 32-6 48-6s32 2 48 6L440 64l8 136c0 122-83 205-168 248C195 405 112 322 112 200Z" fill="#fffdfb"/>
    <path d="m64 164 112 48-56 34Z" fill="#ead7d2"/><path d="m448 164-112 48 56 34Z" fill="#e7d9e6"/>
    <path d="M144 246 224 214l32 36-56 54-56-15Z" fill="#2b1022"/><path d="M368 246 288 214l-32 36 56 54 56-15Z" fill="#2b1022"/>
    <g class="eye-blink"><rect x="197" y="250" width="18" height="18" rx="4" fill="#fffdfb"/><rect x="297" y="250" width="18" height="18" rx="4" fill="#fffdfb"/></g>
    <g class="eye-glance" fill="#2b1022"><rect x="203" y="254" width="7" height="10" rx="2"/><rect x="302" y="254" width="7" height="10" rx="2"/></g>
    <path d="m216 367 40 30 40-30" fill="none" stroke="#2b1022" stroke-linecap="round" stroke-linejoin="round" stroke-width="12"/>
  </g>
</svg>
